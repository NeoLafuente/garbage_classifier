name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main  # Change this if your main branch has a different name (e.g., master)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true  # Enable if you use Git LFS for large files

      - name: Prepare for Hugging Face
        run: |
          # Replace .gitignore with HF-specific version
          if [ -f .gitignore.hf ]; then
            cp .gitignore.hf .gitignore
            echo "Using .gitignore.hf for Hugging Face"
          else
            echo "Warning: .gitignore.hf not found, using default .gitignore"
          fi
          
          # Add files that were previously ignored (now allowed by .gitignore.hf)
          git add -A
          git status
          
          # Commit changes if there are any
          git diff --staged --quiet || git commit -m "Sync from GitHub with data files for HF Space"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/NeoLafuente/GarbageClassifier.git
          git push hf main:main --force